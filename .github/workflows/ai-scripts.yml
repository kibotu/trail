name: AI Scripts

on:
  schedule:
    # https://crontab.guru/#0_10_*_*_*
    - cron: '0 10 * * *'
    # https://crontab.guru/#30_19_*_*_*
    - cron: '30 19 * * *'
  workflow_dispatch:

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TRAIL_API_KEY: ${{ secrets.KIBOTU_TRAIL_API_TOKEN }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      # OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install OpenCode 2
        run: npm install -g @opencode/cli@latest

      - name: Verify OpenCode version
        run: opencode --version

      - name: Restore script caches
        uses: actions/cache@v6
        with:
          path: |
            topic-generation/.tag_generation_cache.json
            entry-rewriter/.entry_rewrite_cache.json
          # Unique key per run so the updated cache is saved; restore-keys picks up the latest.
          key: ai-scripts-cache-${{ github.run_id }}
          restore-keys: ai-scripts-cache-

      - name: Generate tags
        working-directory: topic-generation
        run: uv run generate_tags.py

      - name: Rewrite entries
        if: ${{ !cancelled() }}
        working-directory: entry-rewriter
        run: uv run rewrite_entry.py
