name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: always
          gradle-home-cache-excludes: |
            caches/build-cache-1

      # No local.properties here: its absence marks this as a CI build, which enables
      # the google-services/crashlytics plugins against the checked-in sample
      # google-services.json. Debug signing uses the checked-in certificates/debug.jks.

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug -Porg.gradle.offline=false --no-daemon --stacktrace

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest -Porg.gradle.offline=false --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
